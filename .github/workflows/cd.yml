name: CD - Build, Docker & Deliver

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================
  # ETAPA 1: Quality Gate (Validação Prévia Obrigatória)
  # ============================================================
  validate:
    name: Validate Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar .NET SDK 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar e Executar Testes Unitários
        run: |
          dotnet restore GestaoResiduos.sln
          dotnet test GestaoResiduos.UnitTests/GestaoResiduos.UnitTests.csproj -c Release

  # ============================================================
  # ETAPA 2: Empacotamento Docker e Publicação no GHCR
  # ============================================================
  docker-publish:
    name: Build & Push Docker Image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar Tags e Metadados Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/gestao-residuos
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./GestaoResiduos/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # ETAPA 3: Registro da Entrega e Notificação de Deploy
  # ============================================================
  deliver:
    name: Deploy / Delivery
    needs: docker-publish
    runs-on: ubuntu-latest
    steps:
      - name: Resumo da Entrega
        run: |
          echo "=========================================================="
          echo "🚀 CD CONCLUÍDO COM SUCESSO!"
          echo "📦 Imagem publicada: ghcr.io/${{ github.repository }}/gestao-residuos:latest"
          echo "🔖 Tag imutável: sha-${{ github.sha }}"
          echo "=========================================================="
