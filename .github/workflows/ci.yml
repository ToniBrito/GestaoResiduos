name: CI - Build & Tests

on:
  push:
    branches: [ main, dev, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar .NET SDK 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependências NuGet
        run: dotnet restore GestaoResiduos.sln

      - name: Compilar Solução (Release)
        run: dotnet build GestaoResiduos.sln --no-restore -c Release

      - name: Executar Testes Unitários
        run: |
          dotnet test GestaoResiduos.UnitTests/GestaoResiduos.UnitTests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage"

      - name: Publicar Resultados dos Testes (Artefato)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
